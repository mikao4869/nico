    <link rel="stylesheet" href="../MOMENT/CSS/greeting.css"> 
    <title>Momentum App</title>

  <body>
    <form class="hidden" id="login-form">

    <form id="todo-form">
      <input type="text" placeholder="Write a To Do and Press Enter "required>
    </form>
    <ul id="todo-list">  
      <li>Hello</li>
    </ul>
    <div id="quote">
      <span></span>
      <span></span>
    </div> 
    <script src="../MOMENT/JS/greeting.js"></script>
    <script src="../MOMENT/JS/clock.js"></script>
    <script src="../MOMENT/JS/quotes.js"></script>
    <script src="../MOMENT/JS/todojs.js"></script>


  </body>
</html>
