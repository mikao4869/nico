<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../MOMENT/CSS/greeting.css"> 
    <title>Momentum App</title>
  </head>
  <body>
    <form class="hidden" id="login-form">
      <input class="LoginNameinput" required maxlength="15" type="text" placeholder="what is your name?" />
      <button class="LoginNameButton">Log in</button>
    </form>
    <h2  class="Clock"id="clock">00:00:00</h2>
    <h1 id="greeting" class="hidden"></h1>
    <div class="ToDoList">
      <div class="ToDoListText">To Do List</div>
      <form id="todo-form">
        <input type="text" placeholder="Write a To Do and Press Enter "required>
      </form>
    </div>
    <ul id="todo-list">  
     
    </ul>
    <div id="quote">
      <span class="Font"></span>
      <span class="Font"></span>
    </div> 
    <script src="../MOMENT/JS/greeting.js"></script>
    <script src="../MOMENT/JS/clock.js"></script>
    <script src="../MOMENT/JS/quotes.js"></script>
    <script src="../MOMENT/JS/todojs.js"></script>
    <script src="../MOMENT/JS/weather.js"></script>



  </body>
</html>
