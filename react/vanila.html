<!DOCTYPE html>
<title>Document</title>
<html>
  <body>
    <button id="btn">click me</button>
    <span></span>
    <!-- 이 부분이 누락된 것 같아서 추가했습니다 -->
  </body>
  <script>
    let counter = 0;
    const button = document.getElementById('btn');
    const span = document.querySelector('span'); // <span> 요소를 선택하는 부분
    function handleClick() {
      counter = counter + 1;
      span.innerText = `Total clicks: ${counter}`; // 템플릿 리터럴 수정
    }
    button.addEventListener('click', handleClick);
  </script>
</html>
